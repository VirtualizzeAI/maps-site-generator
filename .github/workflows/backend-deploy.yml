name: Backend production
on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/**', '.github/workflows/backend-deploy.yml']
  pull_request:
    paths: ['backend/**', 'deploy/**', '.github/workflows/backend-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test && npm run build
        working-directory: backend
      - run: docker build -t backend-check ./backend
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: backend
          push: true
          tags: ghcr.io/virtualizzeai/maps-site-generator-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/VirtualizzeAI/maps-site-generator
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/*
      - name: Update single backend instance
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          scp deploy/compose.yaml deploy/update.sh "$VPS_USER@$VPS_HOST:/opt/stacks/maps-site-generator/"
          ssh "$VPS_USER@$VPS_HOST" "bash /opt/stacks/maps-site-generator/update.sh ghcr.io/virtualizzeai/maps-site-generator-backend@$DIGEST"
